name: Sync Orborus

on:
  workflow_dispatch:
    inputs:
      orborus_version:
        description: "Orborus version to sync"
        required: true
        default: "latest"
  workflow_call:
    inputs:
      orborus_version:
        required: true
        type: string

jobs:
  sync-orborus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["${{ inputs.orborus_version }}"]
    steps:
      - name: Set version
        id: set_version
        env:
          VERSION: ${{ matrix.version }}
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagetools copies the full manifest list (amd64 + arm64) registry-to-registry.
      # A docker pull/tag/push would flatten it to the runner's arch only.
      - name: Retag and push orborus
        run: |
          docker buildx imagetools create \
            -t ghcr.io/shuffle/shuffle-orborus:${{ steps.set_version.outputs.VERSION }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shuffle-orborus:${{ steps.set_version.outputs.VERSION }} \
            ghcr.io/shuffle/orborus:${{ steps.set_version.outputs.VERSION }}

      - name: Inspect result
        run: docker buildx imagetools inspect ghcr.io/shuffle/shuffle-orborus:${{ steps.set_version.outputs.VERSION }}
